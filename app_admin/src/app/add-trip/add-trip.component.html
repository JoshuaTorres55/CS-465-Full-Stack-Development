<div class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-4">Add New Vacation Package</h2>
  
    <form [formGroup]="addForm" (ngSubmit)="onSubmit()">
      
      <div class="mb-3">
        <label class="form-label font-weight-bold">Trip Code</label>
        <input type="text" formControlName="code" class="form-control" 
               [ngClass]="{ 'is-invalid': submitted && f['code'].errors }" />
        <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">
          Trip Code is required.
        </div>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Trip Name</label>
        <input type="text" formControlName="name" class="form-control" 
               [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" />
        <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
          Trip Name is required.
        </div>
      </div>
  
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Length (e.g., 5 nights / 6 days)</label>
          <input type="text" formControlName="length" class="form-control" 
                 [ngClass]="{ 'is-invalid': submitted && f['length'].errors }" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Start Date</label>
          <input type="text" formControlName="start" class="form-control" placeholder="e.g., 2026-07-10T00:00:00.000Z"
                 [ngClass]="{ 'is-invalid': submitted && f['start'].errors }" />
        </div>
      </div>
  
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Resort Location</label>
          <input type="text" formControlName="resort" class="form-control" 
                 [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Cost Per Person</label>
          <input type="text" formControlName="perPerson" class="form-control" 
                 [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }" />
        </div>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Image Asset Filename (e.g., reef.jpg)</label>
        <input type="text" formControlName="image" class="form-control" 
               [ngClass]="{ 'is-invalid': submitted && f['image'].errors }" />
      </div>
  
      <div class="mb-4">
        <label class="form-label">Trip Description</label>
        <textarea formControlName="description" rows="3" class="form-control" 
                  [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"></textarea>
      </div>
  
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Save Trip Package</button>
        <a class="btn btn-secondary" href="/">Cancel</a>
      </div>
  
    </form>
  </div>
