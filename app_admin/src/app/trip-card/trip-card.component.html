<div class="card h-100 shadow-sm" style="width: 100%;">
    <img [src]="'assets/images/' + trip.image" class="card-img-top" [alt]="trip.name" style="height: 200px; object-fit: cover;">
    <div class="card-body d-flex flex-column">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="card-title mb-0 text-primary">{{ trip.name }}</h5>
        <span class="badge badge-secondary">{{ trip.code }}</span>
      </div>
      <h6 class="card-subtitle mb-2 text-muted">{{ trip.length }}</h6>
      <p class="card-text text-secondary flex-grow-1">{{ trip.description }}</p>
      <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
        <span class="h5 mb-0 text-success">{{ trip.perPerson | currency }}</span>
        <button class="btn btn-sm btn-outline-primary shadow-sm">Manage Trip</button>
      </div>
    </div>
  </div>
